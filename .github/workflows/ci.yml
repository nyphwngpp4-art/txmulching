name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Dry-run only. Do not deploy from CI. Do not pass --var or a secrets
      # file: a plain var with the same name as a Worker secret would replace it.
      - run: npx wrangler deploy --dry-run --outdir dist
